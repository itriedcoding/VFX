name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, verify and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Luau
        run: |
          curl -sSL -o luau.zip https://github.com/luau-lang/luau/releases/latest/download/luau-ubuntu.zip
          mkdir -p /tmp/luau
          unzip -o luau.zip -d /tmp/luau
          chmod +x /tmp/luau/luau /tmp/luau/luau-compile
          /tmp/luau/luau-compile --help >/dev/null

      - name: Verify (compile, build, manifest, tests)
        run: npm run verify

      - name: Check the tag matches Version.lua
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          LUA=$(node -e "const fs=require('fs');console.log(fs.readFileSync('src/Core/Version.lua','utf8').match(/Version.VERSION\s*=\s*\"([^\"]+)\"/)[1])")
          if [ "$TAG" != "$LUA" ]; then
            echo "Tag v$TAG does not match Version.lua $LUA"
            exit 1
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VFXStudio.rbxmx
            dist/manifest.json
          generate_release_notes: true
          fail_on_unmatched_files: true
